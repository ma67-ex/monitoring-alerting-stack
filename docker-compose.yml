x-health: &health
  interval: 10s
  timeout: 3s
  retries: 3

services:
  app:
    build: ./app
    restart: unless-stopped
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics')"]
  collector:
    build: ./collector
    restart: unless-stopped
    ports: ["127.0.0.1:9090:9090"]
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_SILENCE: ${ALERT_SILENCE:-}
      COLLECTOR_DATA: /data/collector.json
      PROBE_URLS: ${PROBE_URLS:-}
      PROBE_INTERVAL: ${PROBE_INTERVAL:-300}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_SERVER: ${NTFY_SERVER:-https://ntfy.sh}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes: ["collector-data:/data"]
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/health')"]
  dashboard:
    build: ./dashboard
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      collector: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/')"]

volumes:
  collector-data:
