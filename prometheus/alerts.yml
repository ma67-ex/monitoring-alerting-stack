groups:
  - name: agent
    rules:
      - alert: ServiceDown
        expr: up{job="app"} == 0
        for: 30s
        labels: {severity: critical}
        annotations: {summary: "app is not responding to scrapes"}
      - alert: HighErrorRate
        expr: sum(rate(agent_requests_total{status="500"}[1m])) / sum(rate(agent_requests_total[1m])) > 0.05
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "more than 5% of requests are failing"}
      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(agent_request_seconds_bucket[1m])) by (le)) > 1
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "p95 latency above 1 second"}
